name: Tests

on:
  push:
    branches:
      - master
  pull_request:

jobs:

  tests:

    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.0', '8.1', '8.2', '8.3', '8.4', '8.5']
        laravel: [9, 10, 11, 12, 13]
        exclude:
          # Laravel 10 requires PHP >= 8.1, 11 and 12 require >= 8.2, 13 requires >= 8.3.
          - php: '8.0'
            laravel: 10
          - php: '8.0'
            laravel: 11
          - php: '8.0'
            laravel: 12
          - php: '8.0'
            laravel: 13
          - php: '8.1'
            laravel: 11
          - php: '8.1'
            laravel: 12
          - php: '8.1'
            laravel: 13
          - php: '8.2'
            laravel: 13

    name: PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }}

    steps:
    - uses: actions/checkout@v4

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: ${{ matrix.php }}
        coverage: none

    - name: Install Dependencies
      run: |
        composer update --no-ansi --no-interaction --prefer-dist \
          --with "illuminate/support:^${{ matrix.laravel }}.0" \
          --with "illuminate/filesystem:^${{ matrix.laravel }}.0" \
          --with "illuminate/config:^${{ matrix.laravel }}.0" \
          --with "illuminate/container:^${{ matrix.laravel }}.0" \
          --with "illuminate/cache:^${{ matrix.laravel }}.0"

    # Zonder --display-deprecations, want die optie bestaat pas vanaf PHPUnit 10 en op
    # PHP 8.0 wordt PHPUnit 9.6 geïnstalleerd.
    - name: Run PHPUnit
      run: ./vendor/bin/phpunit
